[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recover-control"
version = "0.2.0"
description = "Diagnosis-aware, bounded revenue recovery for Razorpay test mode"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "tigramite==5.2.10.1", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
